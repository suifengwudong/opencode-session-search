[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-session-search"
version = "0.1.0"
description = "Search OpenCode sessions across every project from the terminal"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "suifengwudong" }]
keywords = ["opencode", "session", "search", "cli", "sqlite"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
ses = "ses:main"

[tool.setuptools]
py-modules = ["ses"]

[tool.pytest.ini_options]
testpaths = ["tests"]
